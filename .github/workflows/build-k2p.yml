name: Build Phicomm K2P Padavan TPLink Style OVPN

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

      - name: Clone Padavan Source (hanwckf)
        run: |
          REPO_HOST="github.com"
          REPO_PATH="hanwckf/rt-n56u.git"
          git clone --depth=1 "https://${REPO_HOST}/${REPO_PATH}" padavan

      - name: Inject TP-Link Style OpenVPN Client UI
        run: |
          cat << 'EOF' > inject_tplink_ovpn.py
          import glob

          tplink_ui = """
          <style>
          #tplink_vpn_card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
            padding: 20px;
            margin: 12px 0 18px 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #1e293b;
          }
          .tp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 14px;
            margin-bottom: 16px;
          }
          .tp-title {
            font-size: 17px;
            font-weight: 700;
            color: #00a896;
            display: flex;
            align-items: center;
            gap: 8px;
          }
          .tp-badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: #ef4444;
            letter-spacing: 0.3px;
          }
          .tp-badge.connected {
            background: #00a896;
          }
          .tp-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
          }
          .tp-label {
            width: 160px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
          }
          .tp-control {
            flex: 1;
            min-width: 220px;
          }
          .tp-file-btn {
            display: inline-block;
            background: #f0fdfa;
            border: 1.5px dashed #00a896;
            color: #00897b;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
          }
          .tp-file-btn:hover {
            background: #ccfbf1;
          }
          .tp-input {
            width: 100%;
            max-width: 280px;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            color: #0f172a;
            background: #fff;
          }
          .tp-input:focus {
            outline: none;
            border-color: #00a896;
            box-shadow: 0 0 0 2px rgba(0,168,150,0.15);
          }
          .tp-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
          }
          .tp-save-btn {
            background: #00a896;
            color: #fff;
            border: none;
            padding: 10px 26px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,168,150,0.3);
          }
          .tp-save-btn:hover {
            background: #00897b;
          }
          .tp-adv-btn {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
          }
          .tp-msg {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #00897b;
          }
          </style>

          <div id="tplink_vpn_card">
            <div class="tp-header">
              <div class="tp-title">OpenVPN Client</div>
              <div id="tp_status_badge" class="tp-badge">Disconnected</div>
            </div>

            <div class="tp-row">
              <div class="tp-label">VPN Connection:</div>
              <div class="tp-control">
                <select id="tp_enable_select" class="tp-input" style="max-width:160px;" onchange="syncTpEnable(this.value)">
                  <option value="1">Enabled (ON)</option>
                  <option value="0">Disabled (OFF)</option>
                </select>
              </div>
            </div>

            <div class="tp-row">
              <div class="tp-label">Configuration File:</div>
              <div class="tp-control">
                <label class="tp-file-btn">
                  Browse .ovpn File...
                  <input type="file" id="ovpn_file_input" accept=".ovpn,.conf,.txt" onchange="parseOvpnFile(this)" style="display:none;" />
                </label>
                <span id="tp_file_name" style="margin-left:10px;font-size:12px;color:#64748b;">No file chosen</span>
                <div id="ovpn_status_msg" class="tp-msg"></div>
              </div>
            </div>

            <div class="tp-row">
              <div class="tp-label">Server Address:</div>
              <div class="tp-control">
                <input type="text" id="tp_server_display" class="tp-input" placeholder="Auto-filled from .ovpn" oninput="if(document.form.vpnc_peer) document.form.vpnc_peer.value=this.value;" />
              </div>
            </div>

            <div class="tp-row">
              <div class="tp-label">Username:</div>
              <div class="tp-control">
                <input type="text" id="tp_user_input" class="tp-input" placeholder="Optional (if required by server)" oninput="if(document.form.vpnc_user) document.form.vpnc_user.value=this.value;" />
              </div>
            </div>

            <div class="tp-row">
              <div class="tp-label">Password:</div>
              <div class="tp-control">
                <input type="password" id="tp_pass_input" class="tp-input" placeholder="Optional (if required by server)" oninput="if(document.form.vpnc_pass) document.form.vpnc_pass.value=this.value;" />
              </div>
            </div>

            <div class="tp-actions">
              <button type="button" class="tp-save-btn" onclick="tpApplyAndConnect()">Save & Connect</button>
              <button type="button" class="tp-adv-btn" onclick="togglePadavanRaw()">Show / Hide Advanced Settings</button>
            </div>
          </div>

          <script>
          function syncTpEnable(val) {
            if (document.form.vpnc_enable) {
              document.form.vpnc_enable.value = val;
            }
          }

          function tpApplyAndConnect() {
            if (document.form.vpnc_type) document.form.vpnc_type.value = "2";
            if (document.form.vpnc_user) document.form.vpnc_user.value = document.getElementById("tp_user_input").value;
            if (document.form.vpnc_pass) document.form.vpnc_pass.value = document.getElementById("tp_pass_input").value;
            if (typeof applyRule === "function") {
              applyRule();
            } else {
              document.form.submit();
            }
          }

          function togglePadavanRaw() {
            var tbls = document.getElementsByTagName("table");
            for (var i = 0; i < tbls.length; i++) {
              var t = tbls.item(i);
              if (t.innerHTML.indexOf("vpnc_peer") !== -1 && t.id !== "tplink_vpn_card") {
                t.style.display = (t.style.display === "none") ? "" : "none";
              }
            }
          }

          function initTpLinkUI() {
            if (document.form && document.form.vpnc_enable) {
              document.getElementById("tp_enable_select").value = document.form.vpnc_enable.value;
            }
            if (document.form && document.form.vpnc_peer) {
              document.getElementById("tp_server_display").value = document.form.vpnc_peer.value;
            }
            if (document.form && document.form.vpnc_user) {
              document.getElementById("tp_user_input").value = document.form.vpnc_user.value;
            }
            if (document.form && document.form.vpnc_pass) {
              document.getElementById("tp_pass_input").value = document.form.vpnc_pass.value;
            }
          }

          function updateOvpnLiveStatus() {
            var badge = document.getElementById("tp_status_badge");
            if (!badge) return;
            var isConnected = false;
            var stateCell = document.getElementById("vpnc_state") || document.getElementById("vpnc_status");
            if (stateCell && /connected/i.test(stateCell.innerText) && !/dis/i.test(stateCell.innerText)) {
              isConnected = true;
            }
            if (typeof vpnc_state_t !== "undefined" && vpnc_state_t == 1) {
              isConnected = true;
            }
            if (isConnected) {
              badge.innerText = "Connected";
              badge.className = "tp-badge connected";
            } else {
              badge.innerText = "Disconnected";
              badge.className = "tp-badge";
            }
          }

          setInterval(updateOvpnLiveStatus, 2000);
