name: Build Phicomm K2P Padavan Clean UI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

      - name: Clone Padavan Source (hanwckf)
        run: |
          REPO_HOST="github.com"
          REPO_PATH="hanwckf/rt-n56u.git"
          git clone --depth=1 "https://${REPO_HOST}/${REPO_PATH}" padavan

      - name: Add Safe OVPN Importer Without Touching Core UI
        run: |
          python3 -c '
          import glob

          # Only modify VPN_Client.asp safely without touching state.js or sidebar menus
          vpn_files = glob.glob("padavan/trunk/user/www/**/VPN_Client.asp", recursive=True) + glob.glob("padavan/trunk/user/www/**/vpnc.asp", recursive=True)
          
          upload_script = """
          <div style="background:#eef6ff;padding:10px;margin:8px 0;border:1px solid #8ab4f8;border-radius:4px;color:#000;">
            <b>Import .ovpn Config File: </b>
            <input type="file" id="ovpn_file_input" accept=".ovpn,.conf,.txt" onchange="parseOvpnFile(this)" />
            <div id="ovpn_status_msg" style="margin-top:5px;color:#0b57d0;font-weight:bold;"></div>
          </div>
          <script>
          function parseOvpnFile(input) {
            if (!input.files || !input.files[0]) return;
            var reader = new FileReader();
            reader.onload = function(e) {
              var text = e.target.result;
              
              var remoteMatch = text.match(/^remote\\s+([^\\s]+)\\s+(\\d+)/m);
              if (remoteMatch) {
                if (document.form.vpnc_peer) document.form.vpnc_peer.value = remoteMatch[1];
                if (document.form.vpnc_ov_port) document.form.vpnc_ov_port.value = remoteMatch[2];
              }
              
              var protoMatch = text.match(/^proto\\s+(udp|tcp)/mi);
              if (protoMatch && document.form.vpnc_ov_prot) {
                document.form.vpnc_ov_prot.value = (protoMatch[1].toLowerCase() === "tcp") ? "1" : "0";
              }
              
              var cipherMatch = text.match(/^(?:cipher|data-ciphers)\\s+([^\\s:]+)/m);
              if (cipherMatch && document.form.vpnc_ov_ciph) {
                document.form.vpnc_ov_ciph.value = cipherMatch[1];
              }
              
              var caMatch = text.match(/<ca>([\\s\\S]*?)<\\/ca>/);
              if (caMatch && document.form.ovpnc_ca_crt) document.form.ovpnc_ca_crt.value = caMatch[1].trim();
              
              var certMatch = text.match(/<cert>([\\s\\S]*?)<\\/cert>/);
              if (certMatch && document.form.ovpnc_cli_crt) document.form.ovpnc_cli_crt.value = certMatch[1].trim();
              
              var keyMatch = text.match(/<key>([\\s\\S]*?)<\\/key>/);
              if (keyMatch && document.form.ovpnc_cli_key) document.form.ovpnc_cli_key.value = keyMatch[1].trim();
              
              var tlsMatch = text.match(/<tls-auth>([\\s\\S]*?)<\\/tls-auth>/) || text.match(/<tls-crypt>([\\s\\S]*?)<\\/tls-crypt>/);
              if (tlsMatch && document.form.ovpnc_ta_key) document.form.ovpnc_ta_key.value = tlsMatch[1].trim();

              var authBlock = text.match(/<auth-user-pass>([\\s\\S]*?)<\\/auth-user-pass>/);
              var requiresAuth = /^auth-user-pass/m.test(text);
              var msgBox = document.getElementById("ovpn_status_msg");

              if (authBlock) {
                var creds = authBlock[1].trim().split(/\\r?\\n/);
                if (creds.length >= 2) {
                  if (document.form.vpnc_user) document.form.vpnc_user.value = creds[0].trim();
                  if (document.form.vpnc_pass) document.form.vpnc_pass.value = creds[1].trim();
                  msgBox.innerHTML = "OVPN imported with Username & Password! Click Apply to connect.";
                }
              } else if (requiresAuth) {
                msgBox.style.color = "#c5221f";
                msgBox.innerHTML = "OVPN imported! Please enter your Username and Password below, then click Apply.";
              } else {
                msgBox.innerHTML = "OVPN certificates imported successfully! Click Apply to connect.";
              }
            };
            reader.readAsText(input.files[0]);
          }
          </script>
          """

          for fpath in vpn_files:
              with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              if "vpnc_peer" in content and "ovpn_file_input" not in content:
                  content = content.replace("<form ", upload_script + "\n<form ", 1)
                  with open(fpath, "w", encoding="utf-8") as f:
                      f.write(content)
          '

      - name: Build Toolchain
        run: |
          cd padavan/toolchain-mipsel
          if [ -f "./clean_sources" ]; then
            ./clean_sources
          fi
          ./build_toolchain

      - name: Configure K2P 16MB with OpenVPN, WISP Mode and Network Controls
        run: |
          cd padavan/trunk
          CONFIG_FILE="configs/templates/K2P.config"
          
          # Set UI language to English only
          sed -i 's/CONFIG_FIRMWARE_UI_LANG_CN=y/#CONFIG_FIRMWARE_UI_LANG_CN=y/g' $CONFIG_FILE
          echo "CONFIG_FIRMWARE_UI_LANG_EN=y" >> $CONFIG_FILE
          
          # Enable OpenVPN (Server and Client) and OpenSSL
          sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_OPENVPN.*/CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/g' $CONFIG_FILE
          sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE.*/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' $CONFIG_FILE
          
          # Enable Wireless AP-Client / WISP Mode (2.4G & 5G)
          sed -i 's/.*CONFIG_FIRMWARE_WIFI2_APCLI.*/CONFIG_FIRMWARE_WIFI2_APCLI=y/g' $CONFIG_FILE
          sed -i 's/.*CONFIG_FIRMWARE_WIFI5_APCLI.*/CONFIG_FIRMWARE_WIFI5_APCLI=y/g' $CONFIG_FILE
          
          # Enable Network Controls (DDNS, IPv6, HTTPS, tcpdump)
          sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_DDNS.*/CONFIG_FIRMWARE_INCLUDE_DDNS=y/g' $CONFIG_FILE
          sed -i 's/.*CONFIG_FIRMWARE_ENABLE_IPV6.*/CONFIG_FIRMWARE_ENABLE_IPV6=y/g' $CONFIG_FILE
          sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_HTTPS.*/CONFIG_FIRMWARE_INCLUDE_HTTPS=y/g' $CONFIG_FILE
          sed -i 's/.*CONFIG_FIRMWARE_INCLUDE_TCPDUMP.*/CONFIG_FIRMWARE_INCLUDE_TCPDUMP=y/g' $CONFIG_FILE
          
          # Remove heavy packages to keep firmware under 15MB
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_ARIA=y/#CONFIG_FIRMWARE_INCLUDE_ARIA=y/g' $CONFIG_FILE
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION=y/#CONFIG_FIRMWARE_INCLUDE_TRANSMISSION=y/g' $CONFIG_FILE
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_TOR=y/#CONFIG_FIRMWARE_INCLUDE_TOR=y/g' $CONFIG_FILE
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_SFE=y/#CONFIG_FIRMWARE_INCLUDE_SFE=y/g' $CONFIG_FILE
          
          # Copy template to active .config
          cp -f $CONFIG_FILE .config

      - name: Build K2P Firmware
        run: |
          cd padavan/trunk
          ./clear_tree
          fakeroot ./build_firmware_modify K2P

      - name: Check Firmware Size
        run: |
          ls -lh padavan/trunk/images/*.trx

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phicomm-K2P-Padavan-CleanUI-OVPN
          path: padavan/trunk/images/*.trx
