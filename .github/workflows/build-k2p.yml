name: Build Easy OpenWrt K2P Auto-VPN

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt source
        run: |
          git clone https://openwrt.org
          cd openwrt
          git checkout openwrt-24.10

      - name: Update feeds and add Argon theme
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          git clone https://github.com package/luci-theme-argon

      - name: Pre-configure VPN Network and Firewall
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-auto-vpn-setup
          #!/bin/sh
          uci set network.vpn0=interface
          uci set network.vpn0.proto='none'
          uci set network.vpn0.device='tun0'

          uci add firewall zone
          uci set firewall.@zone[-1].name='vpn_zone'
          uci set firewall.@zone[-1].input='REJECT'
          uci set firewall.@zone[-1].output='ACCEPT'
          uci set firewall.@zone[-1].forward='REJECT'
          uci set firewall.@zone[-1].masq='1'
          uci set firewall.@zone[-1].mtu_fix='1'
          uci add_list firewall.@zone[-1].network='vpn0'

          uci add firewall forwarding
          uci set firewall.@forwarding[-1].src='lan'
          uci set firewall.@forwarding[-1].dest='vpn_zone'

          uci commit network
          uci commit firewall
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-auto-vpn-setup

      - name: Configure K2P firmware
        run: |
          cd openwrt
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_openvpn-openssl=y
          CONFIG_PACKAGE_luci-app-openvpn=y
          CONFIG_PACKAGE_luci-app-upnp=y
          EOF
          make defconfig

      - name: Download packages and compile firmware
        run: |
          cd openwrt
          make download -j$(nproc)
          make -j$(nproc)

      - name: Upload K2P Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Phicomm-K2P-Easy-VPN
          path: openwrt/bin/targets/ramips/mt7621/*phicomm_k2p*sysupgrade.bin
