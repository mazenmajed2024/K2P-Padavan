#!/bin/bash
set -e

if [ "$(id -u)" -eq 0 ]; then
    echo "Error: Do not run this script as root or with sudo."
    exit 1
fi

sudo apt update
sudo apt install -y unzip libtool-bin curl cmake gperf gawk flex bison \
nano xxd fakeroot git python3-docutils autopoint automake bash build-essential \
bzip2 cpio device-tree-compiler gettext help2man libncurses5-dev libssl-dev \
patch pkg-config rsync scons tar texinfo u-boot-tools util-linux wget zlib1g-dev python3

rm -rf rt-n56u
git clone https://github.com
cd rt-n56u

python3 - << 'EOF'
import os
import sys

target_file = "trunk/user/www/n56u_ribbon_fixed/vpnc.asp"
if not os.path.exists(target_file):
    print("Error: vpnc.asp not found!")
    sys.exit(1)

with open(target_file, "r", encoding="utf-8", errors="ignore") as f:
    content = f.read()

ovpn_importer_code = """
<script>
function parseOVPNFile(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var text = e.target.result;

        if (document.form.vpnc_type) {
            document.form.vpnc_type.value = "3";
            if (typeof change_vpnc_type === "function") change_vpnc_type();
        }

        var remoteMatch = text.match(/^remote\\s+([^\\s]+)\\s+(\\d+)/m);
        if (remoteMatch) {
            if (document.form.vpnc_peer) document.form.vpnc_peer.value = remoteMatch[1];
            if (document.form.vpnc_ov_port) document.form.vpnc_ov_port.value = remoteMatch[2];
        }

        var protoMatch = text.match(/^proto\\s+(udp|tcp)/mi);
        if (protoMatch && document.form.vpnc_ov_prot) {
            document.form.vpnc_ov_prot.value = (protoMatch[1].toLowerCase().indexOf('tcp') !== -1) ? '1' : '0';
        }

        var cipherMatch = text.match(/^(?:cipher|data-ciphers)\\s+([^\\r\\n]+)/m);
        if (cipherMatch && document.form.vpnc_ov_cnat) {
            var c = cipherMatch[1].split(':')[0].trim();
            for (var i = 0; i < document.form.vpnc_ov_cnat.options.length; i++) {
                if (document.form.vpnc_ov_cnat.options[i].text.indexOf(c) !== -1) {
                    document.form.vpnc_ov_cnat.selectedIndex = i;
                    break;
                }
            }
        }

        if (/^auth-user-pass/m.test(text) && document.form.vpnc_ov_auth) {
            document.form.vpnc_ov_auth.value = "1";
            if (typeof change_vpnc_ov_auth === "function") change_vpnc_ov_auth();
        }

        var authBlockMatch = text.match(/<auth-user-pass>([\\s\\S]*?)<\\/auth-user-pass>/);
        if (authBlockMatch) {
            var lines = authBlockMatch[1].trim().split(/\\r?\\n/);
            if (lines.length >= 1 && document.form.vpnc_user) document.form.vpnc_user.value = lines[0].trim();
            if (lines.length >= 2 && document.form.vpnc_pass) document.form.vpnc_pass.value = lines[1].trim();
        }

        var caMatch = text.match(/<ca>([\\s\\S]*?)<\\/ca>/);
        if (caMatch && document.form.vpnc_ov_ca) document.form.vpnc_ov_ca.value = caMatch[1].trim();

        var certMatch = text.match(/<cert>([\\s\\S]*?)<\\/cert>/);
        if (certMatch && document.form.vpnc_ov_crt) document.form.vpnc_ov_crt.value = certMatch[1].trim();

        var keyMatch = text.match(/<key>([\\s\\S]*?)<\\/key>/);
        if (keyMatch && document.form.vpnc_ov_key) document.form.vpnc_ov_key.value = keyMatch[1].trim();

        var tlsMatch = text.match(/<(?:tls-auth|tls-crypt)>([\\s\\S]*?)<\\/(?:tls-auth|tls-crypt)>/);
        if (tlsMatch && document.form.vpnc_ov_tls) document.form.vpnc_ov_tls.value = tlsMatch[1].trim();

        var extraLines = [];
        text.split(/\\r?\\n/).forEach(function(line) {
            var l = line.trim();
            if (/^(comp-lzo|compress|auth\\s+|tls-client|remote-cert-tls|key-direction|tun-mtu|mssfix)/.test(l)) {
                extraLines.push(l);
            }
        });
        if (extraLines.length > 0 && document.form.vpnc_ov_conf) {
            document.form.vpnc_ov_conf.value = extraLines.join("\\n");
        }

        alert("OVPN File Loaded! Check Username/Password and click Apply.");
    };
    reader.readAsText(file);
}
</script>
<div style="background:#eef6ff;padding:10px;margin:10px 0;border:1px solid #99c2ff;border-radius:4px;">
<b>Import .OVPN File: </b>
<input type="file" accept=".ovpn,.conf" onchange="parseOVPNFile(this)" />
</div>
"""

if '<form method="post" name="form"' not in content:
    print("Error: Target form tag not found in vpnc.asp!")
    sys.exit(1)

content = content.replace('<form method="post" name="form"', ovpn_importer_code + '\n<form method="post" name="form"', 1)
with open(target_file, "w", encoding="utf-8") as f:
    f.write(content)

print("Success: OVPN importer injected cleanly.")
EOF

cd toolchain-mipsel
./clean_sources
./build_toolchain

cd ../trunk
if [ -f "configs/templates/K2P.config" ]; then
    cp configs/templates/K2P.config .config
elif [ -f "configs/templates/k2p.config" ]; then
    cp configs/templates/k2p.config .config
else
    echo "Error: K2P config template not found!"
    exit 1
fi

sed -i 's/#CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/g' .config
sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENVPN=n/CONFIG_FIRMWARE_INCLUDE_OPENVPN=y/g' .config

./clear_tree
./build_firmware
